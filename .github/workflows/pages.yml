name: Publish static website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml' 
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'artfisica/presentacion-Instituto-de-Ingenieria-Venezuela'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate both languages
        run: python3 web/build.py
      - name: Validate local files and links
        run: python3 web/validate.py
      - name: Prepare only public website files
        run: |
          mkdir -p _site
          cp web/index.html web/en.html web/.nojekyll _site/
          cp -R web/assets _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
