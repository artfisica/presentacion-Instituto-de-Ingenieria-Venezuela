name: 03 - Crear PDF

on:
  push:
    paths:
      - 'scripts/resumen_actions.py'
      - 'ejemplos/**'
      - 'imagenes/**'
      - 'fuentes/**'
      - 'scripts/crear_pdf.py'
      - 'tests/test_pdf.py'
      - 'requirements.txt'
      - '.github/workflows/03-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar el ejemplo
        run: |
          python -m unittest discover -s tests -p test_pdf.py -v
          python scripts/crear_pdf.py
      - name: Guardar resultados para descargar
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: documento-pdf
          path: |
            resultados/informe.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Enlace al resultado en el resumen
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '\n[Descargar el resultado](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
